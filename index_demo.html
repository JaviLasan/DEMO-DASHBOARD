<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASHBOARD — Demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{
  --bg:#0b1220; --panel:#111a2e; --panel-2:#0e1626; --border:#1f2c47;
  --text:#e7ecf7; --muted:#8b99b8; --accent:#4f8cff; --accent-2:#ff9f43;
  --green:#37c993; --red:#ff5d6c; --radius:14px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 36px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(11,18,32,.97);backdrop-filter:blur(6px);z-index:30;}
.brand{display:flex;align-items:center;gap:18px;}
.brand .logobox{background:#fff;border-radius:12px;padding:10px 16px;display:flex;align-items:center;}
.brand .logobox img{height:38px;display:block;}
.brand h1{font-size:26px;margin:0;letter-spacing:.2px;font-weight:800;}
.brand span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;}
.updated{font-size:12.5px;color:var(--muted);}
main{width:100%;max-width:1800px;margin:0 auto;padding:22px 36px 70px;}
.state{color:var(--muted);font-size:13px;padding:40px;text-align:center;}

.filters{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;}
.filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px;}
.filter-row:last-child{margin-bottom:0;}
.filter-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;min-width:74px;font-weight:700;}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--border);border-radius:999px;overflow:hidden;padding:3px;gap:2px;}
.seg button{border:none;background:transparent;color:var(--muted);padding:8px 18px;font-size:13px;cursor:pointer;font-weight:600;border-radius:999px;}
.seg button.active{background:var(--accent);color:#fff;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{border:1px solid var(--border);background:var(--panel-2);color:var(--text);padding:6px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;white-space:nowrap;font-weight:600;}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.chip.all{border-style:dashed;}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr);}}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 15px;}
.kpi .label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.kpi .value{font-size:18px;font-weight:700;}
.kpi .value.neg{color:var(--red);} .kpi .value.pos{color:var(--green);}

.alert{display:flex;gap:10px;align-items:center;background:rgba(255,93,108,.1);border:1px solid rgba(255,93,108,.35);color:#ffb3ba;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:13px;}
.alert.ok{background:rgba(55,201,147,.1);border-color:rgba(55,201,147,.35);color:#a9f0d4;}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
.panel h3{margin:0 0 12px;font-size:14px;font-weight:700;}
.panel h3 small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px;}
canvas{max-height:280px;}

.pivot-wrap{overflow-x:auto;cursor:grab;}
.pivot-wrap.dragging{cursor:grabbing;user-select:none;}
table.pivot{border-collapse:collapse;width:100%;font-size:13px;}
table.pivot th, table.pivot td{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;}
table.pivot thead th{position:sticky;top:0;background:var(--panel);color:#d4dae8;font-weight:600;font-size:11px;text-transform:uppercase;text-align:right;border-bottom:1px solid var(--border);cursor:pointer;}
table.pivot thead th:hover{color:var(--accent);}
table.pivot thead th.rowlabel{text-align:left;cursor:default;}
table.pivot thead th.rowlabel:hover{color:#d4dae8;}
table.pivot thead th.total{color:#d4dae8;font-weight:800;}
table.pivot td.amt, table.pivot th{text-align:right;font-variant-numeric:tabular-nums;}
table.pivot td.rowlabel{text-align:left;white-space:nowrap;}
.pos{color:var(--green);}
.neg{color:var(--red);}
td.amt.hot{font-weight:800;}
td.amt.hot .pos{color:#4ee6ae;}
td.amt.hot .neg{color:#ff8992;}
tr.concepto td.rowlabel{font-weight:700;cursor:pointer;}
tr.concepto:hover td{background:rgba(255,255,255,.02);}
tr.sub td.rowlabel{cursor:pointer;padding-left:34px;color:var(--muted);font-weight:600;font-size:12.5px;}
tr.sub:hover td{background:rgba(255,255,255,.02);}
tr.detalle td.rowlabel{padding-left:56px;color:var(--muted);font-weight:400;font-size:12px;}
.arrow{display:inline-block;width:14px;color:var(--muted);}
tr.saldo td{font-weight:700;background:rgba(79,140,255,.07);border-top:2px solid var(--border);}
tr.saldo td.neg{color:var(--red);}
.empty-cols{color:var(--muted);font-size:13px;padding:20px;text-align:center;}
</style>
</head>

/* Ingresos: verde, sin paréntesis. Egresos: rojo, entre paréntesis (convención contable). */
function fmtFlow(v, isIngreso){
  if (isIngreso) return `<span class="pos">${$$(v)}</span>`;
  const av = Math.abs(v);
  return av>0 ? `<span class="neg">(${$$(av)})</span>` : $$(0);
}
/* Igual que fmtFlow pero deja la celda VACIA en vez de mostrar "$0" cuando no hubo
   movimiento en esa columna puntual (usado en las filas de Sub-Concepto, donde la fila
   entera ya se muestra porque tuvo monto en ALGUNA columna, pero no en todas). */
function fmtFlowBlank(v, isIngreso){
  return Math.abs(v) > 1 ? fmtFlow(v, isIngreso) : "";
}
/* Saldo: positivo verde, negativo rojo entre parentesis */
function fmtBalance(v){
  return v>=0 ? `<span class="pos">${$$(v)}</span>` : `<span class="neg">(${$$(Math.abs(v))})</span>`;
}

function toNum(s){
  if (s===undefined || s===null) return 0;
  if (typeof s === "number") return s;
  let str = String(s).trim();
  if (str==="" || str==="-") return 0;
  const isNeg = /^-/.test(str) || str.includes("-$");
  str = str.replace(/[^0-9.,]/g,"");
  if (str==="") return 0;
  if (str.includes(",")) str = str.replace(/\./g,"").replace(",",".");
  else if ((str.match(/\./g)||[]).length > 1) str = str.replace(/\./g,"");
  const n = parseFloat(str);
  return isNaN(n) ? 0 : (isNeg ? -Math.abs(n) : n);
}
/* La planilla de Fondos usa formato EEUU: coma para miles, punto para decimales
   (ej. "7,105,270.46", "2.57%") — al reves que la hoja principal. "#N/A" o vacio = null
   (el fondo todavia no existia ese mes, distinto de "hubo un mes con 0"). */
function toNumUS(s){
  if (s===undefined || s===null) return null;
  if (typeof s === "number") return s;
  let str = String(s).trim();
  if (str==="") return null;
  if (str.includes("#N/A")) return null;
  const isNeg = /^-/.test(str);
  const digits = str.replace(/[^0-9.]/g,"");
  if (digits==="") return 0; /* "\$  -" (guion) representa cero */
  const n = parseFloat(digits);
  return isNaN(n) ? null : (isNeg ? -Math.abs(n) : n);
}
/* Para columnas con formato "Porcentaje": si Google la exporta como NUMERO crudo (celda con
   formato % real), el valor que viene es la fraccion (0,0183) y hay que multiplicar por 100
   para tener los "puntos" (1,83). Si en cambio viene como TEXTO ("1.83%"), toNumUS ya lo
   interpreta bien tal cual (sin necesitar el x100). */
function toPctNum(s){
  if (s===undefined || s===null) return null;
  if (typeof s === "number") return s*100;
  return toNumUS(s);
}
function gvizDate(v){
  if (typeof v === "string"){
    const m = v.match(/Date\((\d+),(\d+),(\d+)/);
    if (m) return new Date(+m[1], +m[2], +m[3]);
  }
  return null;
}
function mondayOf(d){
  const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const wd = (dt.getDay()+6)%7;
  dt.setDate(dt.getDate()-wd);
  return dt;
}
function fmtWeek(d){ return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"}); }
function fmtMonth(y,m){ return MESES[m]+"-"+String(y).slice(2); }
const DIAS_SEMANA = ["LU","MA","MI","JU","VI","SA","DO"];
function fmtDia(d){ const wd=(d.getDay()+6)%7; return DIAS_SEMANA[wd]+" "+d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"}); }
function isoKey(d){ return d.toISOString().slice(0,10); }
/* Para el <input type="date"> necesitamos YYYY-MM-DD en horario LOCAL (no UTC, mismo
   motivo que el bug de las semanas: toISOString() corre el dia para atras en Argentina). */
function isoLocalDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
/* new Date("YYYY-MM-DD") lo interpreta JS como UTC medianoche; en Argentina (UTC-3) eso
   corre la fecha un dia para atras al leerla. Parseo manual para quedarnos en horario local. */
function parseIsoLocal(s){
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function ymKey(y,m){ return y+"-"+m; }

let __c = 0;
function loadSheetJSONP(tab, range, sheetId){
  return new Promise((resolve, reject)=>{
    const cb = "__gvizCB"+(__c++);
    const t = setTimeout(()=>{ done(); reject(new Error(`Timeout en "${tab}"`)); }, 15000);
    function done(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = (resp)=>{ done(); resolve(resp); };
    const s = document.createElement("script");
    let url = `https://docs.google.com/spreadsheets/d/${sheetId||SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&sheet=${encodeURIComponent(tab)}`;
    if (range) url += `&range=${encodeURIComponent(range)}`;
    s.src = url;
    s.onerror = () => { done(); reject(new Error(`No se pudo cargar "${tab}"`)); };
    document.body.appendChild(s);
  });
}
function gvizRows(resp){ return resp.table.rows.map(r=>(r.c||[]).map(c=>c?c.v:null)); }
function gvizLabels(resp){ return resp.table.cols.map(c=>c.label||""); }

function parseBase(resp){
  const labels = gvizLabels(resp).map(l=>String(l).trim().toUpperCase());
  const rows = gvizRows(resp);
  const iConcepto = labels.indexOf("CONCEPTO");
  const iSub = labels.indexOf("SUB-CONCEPTO");
  const iDetalle = labels.indexOf("DETALLE");
  const iFactura = labels.indexOf("FACTURA");
  const iFecha = labels.indexOf("FECHA PAGO");
  const iPend = labels.indexOf('A PAGAR "A"');

  const out = [];
  if (iConcepto>=0 && iFecha>=0 && iPend>=0){
    rows.forEach(row=>{
      const f = gvizDate(row[iFecha]);
      if (!f) return;
      const concepto = (row[iConcepto]||"").toString().trim();
      const sub = (row[iSub]||"").toString().trim() || "(sin detalle)";
      const detalle = iDetalle>=0 ? ((row[iDetalle]||"").toString().trim() || "(sin descripción)") : "(sin descripción)";
      const factura = iFactura>=0 ? (row[iFactura]||"").toString().trim() : "";
      const pendiente = toNum(row[iPend]);
      if (!concepto) return;
      const sign = concepto === "INGRESOS" ? -1 : 1;
      /* El mes/año de cada movimiento es su fecha real de pago (coincide con el criterio de Excel).
         La semana (lunes a lunes) se usa solo para agrupar la vista Semanal; una semana puede
         cruzar el limite de un mes, por eso la vista Semana y la vista Mes pueden diferir en
         movimientos de los ultimos/primeros dias de mes: es correcto, no un error. */
      out.push({fecha:f, y:f.getFullYear(), m:f.getMonth(), week:mondayOf(f), concepto, sub, detalle, factura, val: sign*pendiente});
    });
  }
  return {rows: out};
}
/* El saldo inicial (Y2) se pide APARTE, con range=Y2: al traer una sola celda no hay
   fila de encabezado con la que Google pueda mezclarla, asi que llega siempre limpia. */
function parseSaldoInicial(resp){
  const rows = gvizRows(resp);
  const cell = rows && rows[0] ? rows[0][0] : null;
  return toNum(cell);
}

/* Fondos: la hoja "Resumen" tiene varias filas de encabezado apiladas (titulo, nombres de
   fondo, fila en blanco, encabezado real, fila de base 100%). Pedimos el rango arrancando
   JUSTO en la fila del encabezado real (fila 5: "Fecha, Fondo - $, Fondo - %, Fondo - % Acum...")
   para que gviz la tome de header sin mezclar nada de arriba - la misma tecnica que usamos
   para el saldo inicial de Y2, pero para una grilla entera en vez de una celda. */
function parseFondos(resp){
  const labels = gvizLabels(resp);
  const rows = gvizRows(resp);
  const fondos = [];
  const nombresVistos = {};
  for (let i=1; i<labels.length; i+=3){
    const h = (labels[i]||"").toString();
    if (!h) continue;
    let nombre = h.replace(/\s*-\s*\$\s*$/i,"").trim();
    nombresVistos[nombre] = (nombresVistos[nombre]||0) + 1;
    if (nombresVistos[nombre] > 1) nombre = nombre + " (" + nombresVistos[nombre] + ")";
    fondos.push({nombre, colPesos:i, colPct:i+1, colAcum:i+2});
  }
  const meses = [];
  rows.forEach(row=>{
    /* La celda de "Fecha" puede venir como fecha real de Google (formateada "ene-25" en
       pantalla, pero gviz devuelve el valor crudo tipo Date(...)) o como texto plano.
       Contemplamos los dos casos. */
    const fechaCelda = gvizDate(row[0]);
    let mesLabel;
    if (fechaCelda) mesLabel = MESES[fechaCelda.getMonth()] + "-" + String(fechaCelda.getFullYear()).slice(2);
    else if (row[0]) mesLabel = String(row[0]).trim();
    else return; /* salta la fila de base 100% (no tiene fecha) */
    const punto = { mes: mesLabel, datos: {} };
    fondos.forEach(f=>{
      punto.datos[f.nombre] = {
        pesos: toNumUS(row[f.colPesos]),
        pct: toPctNum(row[f.colPct]),
        acum: toPctNum(row[f.colAcum]),
        patrimonio: null
      };
    });
    meses.push(punto);
  });
  return { fondos: fondos.map(f=>f.nombre), meses };
}

/* Pestaña de detalle de UN fondo (movimientos dia a dia). El propio Sheet marca la fila de
   cierre de mes: es la UNICA fila donde "Variacion %" (col G) e "Importe" (col H) tienen
   valor. Ahi mismo, la columna E ("Total $") es el patrimonio del fondo a ese cierre.
   OJO: estas pestañas usan formato ARGENTINO de numero (punto miles, coma decimal),
   distinto del formato EEUU que usa la pestaña "Resumen". */
function tabDeFondo(nombreFondo){
  if (nombreFondo.startsWith("S12S5")) return "S12S5 LETRAS DEL TESORO CAP $ V";
  return nombreFondo;
}
function parseFondoDetalle(resp){
  const rows = gvizRows(resp);
  /* Para cada mes, me quedo con la fila de fecha MAS ALTA (el ultimo dia registrado
     de ese mes) — no importa el nombre de las columnas, ni si G/H estan cargados,
     solo la fecha y el monto de la columna E. */
  const porMes = {};
  rows.forEach(row=>{
    const fecha = gvizDate(row[0]);
    if (!fecha) return; /* fila sin fecha valida: no es un dato real */
    const key = fecha.getFullYear()+"-"+fecha.getMonth();
    /* >= (no solo >): si hay varias filas con la MISMA fecha (ej. varios movimientos el
       mismo día), me quedo con la ULTIMA cargada en el Sheet, no con la primera. */
    if (!porMes[key] || fecha >= porMes[key].fecha){
      porMes[key] = { fecha, y: fecha.getFullYear(), m: fecha.getMonth(), total: toNum(row[4]) };
    }
  });
  return Object.values(porMes);
}
/* Trae el patrimonio de cierre de mes de las 12 pestañas de detalle (en paralelo) y lo mezcla
   adentro de FONDOS_DATA.meses[].datos[fondo].patrimonio. Si alguna pestaña falla, sigue con
   las demas (ese fondo simplemente queda sin ese dato, no rompe el resto). */
async function cargarPatrimonioFondos(){
  const resultados = await Promise.all(FONDOS_DATA.fondos.map(async fondo=>{
    try{
      const resp = await loadSheetJSONP(tabDeFondo(fondo), null, SHEET_ID_FONDOS);
      return { fondo, cierres: parseFondoDetalle(resp) };
    } catch(err){
      return { fondo, cierres: [] };
    }
  }));
  resultados.forEach(({fondo, cierres})=>{
    cierres.forEach(c=>{
      const idx = FONDOS_DATA.meses.findIndex(m=>{
        const p = parseMesFondo(m.mes);
        return p && p.y===c.y && p.m===c.m;
      });
      if (idx>=0) FONDOS_DATA.meses[idx].datos[fondo].patrimonio = c.total;
    });
  });
}

/* Solo trae y procesa los datos de Fondos (no toca la pantalla) — la usan tanto la solapa
   Fondos como la tabla ejecutiva de la solapa Executive. */
async function cargarFondos(){
  /* Version offline: siempre uso los datos de muestra embebidos, nunca intento red. */
  FONDOS_DATA = FONDOS_DATA_ESTATICA;
  return { esEstatica:false }; /* false para que no muestre el cartel de "no pude conectar" */
}
async function bootFondos(){
  const app = document.getElementById("app");
  app.innerHTML = `<div class="state">Cargando fondos…</div>`;
  const {esEstatica, error} = await cargarFondos();
  renderFondosView(esEstatica, error ? `No pude conectar el Sheet en vivo (${error}), mostrando los datos fijos del CSV.` : undefined);
}
let chartFondosRefs = [];
let chartFondosEvolucionRef = null;
let chartExecRef = null;
let VIEW_FONDOS = { metrica: "pesos", selYears: new Set(), selMonths: new Set() }; /* metrica: "pesos" | "pct" | "acum" */
/* "ene-25" -> {y:2025, m:0} */
function parseMesFondo(mesStr){
  let [abrev, yy] = mesStr.toLowerCase().split("-");
  if (abrev==="sept") abrev="sep"; /* el Sheet a veces escribe "sept" en vez de "sep" */
  const m = MESES.indexOf(abrev);
  if (m<0 || !yy) return null;
  return { y: 2000+parseInt(yy,10), m };
}

function fmtFondoValor(v, metrica){
  /* sin dato (fondo no existia ese mes) y valor cero se ven IGUAL: vacio. Asi no hay
     rayitas mezcladas con blancos que antes se veian inconsistentes. */
  if (v===null || v===undefined) return "";
  if (metrica==="patrimonio"){
    if (Math.abs(v) < 1) return "";
    return v>=0 ? `<span class="pos">${$$(v)}</span>` : `<span class="neg">(${$$(Math.abs(v))})</span>`;
  }
  if (metrica==="pesos"){
    if (Math.abs(v) < 1) return "";
    return v>=0 ? `<span class="pos">${$$(v)}</span>` : `<span class="neg">(${$$(Math.abs(v))})</span>`;
  }
  if (Math.abs(v) < 0.005) return "";
  /* % y % acumulado */
  const txt = v.toFixed(2).replace(".",",") + "%";
  return v>=0 ? `<span class="pos">${txt}</span>` : `<span class="neg">${txt}</span>`;
}

function renderFiltrosFondos(aniosDisp, mesesDispDeAnio){
  let f = `<div class="filter-row"><span class="filter-label">Año(s)</span><div class="chips">`;
  aniosDisp.forEach(y=>{ f += chip(y, VIEW_FONDOS.selYears.has(y), `toggleFondoYear(${y})`); });
  f += `</div></div>`;
  /* si hay mas de un año marcado, separo los meses en una fila por año, asi no van todos
     corridos mezclados. Con un solo año, alcanza con una sola fila (como antes). */
  const aniosConMeses = [...new Set(mesesDispDeAnio.map(m=>m.y))].sort();
  f += `<div class="filter-row"><span class="filter-label">Mes(es)</span><div class="chips">`;
  f += chip("Todos", VIEW_FONDOS.selMonths.size===0, `clearFondoMonths()`, "all");
  if (aniosConMeses.length <= 1){
    mesesDispDeAnio.forEach(m=>{ f += chip(m.mes, VIEW_FONDOS.selMonths.has(m.mes), `toggleFondoMonth('${m.mes}')`); });
    f += `</div></div>`;
  } else {
    f += `</div></div>`;
    aniosConMeses.forEach(y=>{
      f += `<div class="filter-row"><span class="filter-label" style="min-width:74px;">${y}</span><div class="chips">`;
      mesesDispDeAnio.filter(m=>m.y===y).forEach(m=>{
        f += chip(m.mes, VIEW_FONDOS.selMonths.has(m.mes), `toggleFondoMonth('${m.mes}')`);
      });
      f += `</div></div>`;
    });
  }
  return f;
}
function toggleFondoYear(y){ if (VIEW_FONDOS.selYears.has(y)) VIEW_FONDOS.selYears.delete(y); else VIEW_FONDOS.selYears.add(y); VIEW_FONDOS.selMonths=new Set(); renderFondosView(false); }
function toggleFondoMonth(m){ if (VIEW_FONDOS.selMonths.has(m)) VIEW_FONDOS.selMonths.delete(m); else VIEW_FONDOS.selMonths.add(m); renderFondosView(false); }
function clearFondoMonths(){ VIEW_FONDOS.selMonths=new Set(); renderFondosView(false); }

/* Calcula todo lo que necesita la tabla de Fondos (meses filtrados, orden, acumulado, etc)
   a partir del estado actual — lo usan tanto el render completo como la actualizacion
   puntual de la tabla sola (cuando solo cambia la metrica, sin tocar el grafico). */
function calcularVistaFondos(metricaOverride){
  const {fondos} = FONDOS_DATA;
  const mesesTodos = FONDOS_DATA.meses;
  const metrica = metricaOverride || VIEW_FONDOS.metrica;
  const campo = metrica==="pesos" ? "pesos" : metrica==="pct" ? "pct" : metrica==="acum" ? "acum" : "patrimonio";

  const mesesInfo = mesesTodos.map(m => ({...m, ...parseMesFondo(m.mes)}));
  const aniosDisp = [...new Set(mesesInfo.map(m=>m.y))].sort();
  if (!VIEW_FONDOS.selYears.size) aniosDisp.forEach(y=>VIEW_FONDOS.selYears.add(y));
  const mesesDispDeAnio = mesesInfo.filter(m=>VIEW_FONDOS.selYears.has(m.y));
  const meses = (VIEW_FONDOS.selMonths.size
    ? mesesInfo.filter(m => VIEW_FONDOS.selYears.has(m.y) && VIEW_FONDOS.selMonths.has(m.mes))
    : mesesDispDeAnio
  );
  if (!meses.length) return { fondos, meses, aniosDisp, mesesDispDeAnio };

  let acumFiltrado = null;
  if (metrica === "acum"){
    acumFiltrado = {};
    fondos.forEach(f=>{
      let acc = 100;
      acumFiltrado[f] = meses.map(m=>{
        const pct = m.datos[f].pct;
        if (pct!==null && pct!==undefined) acc = acc * (1 + pct/100);
        return acc - 100;
      });
    });
  }
  function valorDe(f, idx){
    return metrica==="acum" ? acumFiltrado[f][idx] : meses[idx].datos[f][campo];
  }

  const ultimoMes = meses[meses.length-1];
  const fondosOrdenadosTodos = [...fondos].sort((a,b)=>{
    const va = valorDe(a, meses.length-1), vb = valorDe(b, meses.length-1);
    const na = (va===null||va===undefined) ? -Infinity : va;
    const nb = (vb===null||vb===undefined) ? -Infinity : vb;
    return nb - na;
  });
  const fondosOrdenados = fondosOrdenadosTodos.filter(f =>
    meses.some((m,idx) => { const v = valorDe(f,idx); return v!==null && v!==undefined && Math.abs(v)>0.009; })
  );
  const totalesPorFondo = fondosOrdenados.map(f => meses.reduce((a,m)=> a + (m.datos[f].pesos||0), 0));
  const totalesPorMes = meses.map(m => fondos.reduce((a,f)=> a + (m.datos[f][campo]||0), 0));
  const mostrarTotales = metrica==="pesos" || metrica==="patrimonio";

  return { fondos, meses, aniosDisp, mesesDispDeAnio, metrica, campo, valorDe, ultimoMes,
    fondosOrdenados, totalesPorFondo, totalesPorMes, mostrarTotales };
}

function renderFondosTablaInner(){
  const v = calcularVistaFondos();
  const { meses, metrica, fondosOrdenados, totalesPorFondo, totalesPorMes, mostrarTotales, valorDe } = v;
  const nombreMetrica = metrica==="pesos" ? "Rendimiento en $" : metrica==="pct" ? "Rendimiento mensual (%)" : metrica==="acum" ? "Rendimiento % acumulado (base 100 = inicio de la selección)" : "Patrimonio (cierre de mes)";

  /* mapa de calor naranja POR COLUMNA (cada mes compara todos los fondos entre si, no cada
     fondo contra si mismo): mas oscuro = el fondo que mas rindio ESE mes puntual. */
  const esPctHeat = metrica==="pct" || metrica==="acum";
  const maxAbsPorColumna = meses.map((m,idx)=>{
    const vals = fondosOrdenados.map(f=>valorDe(f,idx)).filter(x=>x!==null&&x!==undefined).map(x=>Math.abs(x));
    return Math.max(0.01, ...vals);
  });

  return `

function renderFondosView(esEstatica, mensajeError){
  const app = document.getElementById("app");

  const v = calcularVistaFondos();
  const { fondos, meses, aniosDisp, mesesDispDeAnio } = v;

  if (!meses.length){
    app.innerHTML = `<div class="filters">${renderFiltrosFondos(aniosDisp, mesesDispDeAnio)}</div><div class="empty-cols">No hay meses para mostrar con este filtro.</div>`;
    return;
  }
  const { ultimoMes } = v;

  let html = "";
  if (mensajeError){
    html += `<div class="alert">⚠ ${mensajeError}</div>`;
  } else if (esEstatica){
    html += `<div class="alert" style="background:rgba(79,140,255,.1);border-color:rgba(79,140,255,.35);color:#bcd3ff;">ℹ Mostrando los datos del CSV que me pasaste (no está conectado al Sheet en vivo todavía).</div>`;

     en $ comparten el eje izquierdo (ambos son pesos), Rendimiento % va en un eje derecho
     propio (escala muy distinta, no se puede comparar en el mismo eje que los millones de

        { type:"bar", label:"Rendimiento $", data: fondosCombo.map(d=>d.pesos), backgroundColor:"#d99a5b", yAxisID:"y2", borderRadius:3, order:2 },

        y2:{position:"right", grid:{display:false}, ticks:{color:"#d99a5b", callback:(v)=>$$(v)}, title:{display:true,text:"$ Rendimiento",color:"#d99a5b",font:{size:10.5}}},

/* Distancia de un punto (px,py) al SEGMENTO (no a la recta infinita) entre (x1,y1)-(x2,y2) */
function distanciaASegmento(px,py, x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const len2 = dx*dx+dy*dy;
  let t = len2===0 ? 0 : ((px-x1)*dx+(py-y1)*dy)/len2;
  t = Math.max(0, Math.min(1,t));
  const cx = x1+t*dx, cy = y1+t*dy;
  return { dist: Math.hypot(px-cx, py-cy), t };
}
/* Plugin: el nombre del fondo aparece cuando el mouse toca la LINEA (cualquier tramo entre
   dos puntos), no solo cuando esta justo encima de un punto de dato. Dibuja su PROPIO
   cartelito flotante en HTML (no usa el tooltip nativo de Chart.js, para no competir con el
   comportamiento por defecto basado en puntos). */
const lineHoverPlugin = {
  id: "lineHover",
  afterEvent(chart, args){
    const e = args.event;
    if (e.type !== "mousemove" && e.type !== "mouseout") return;
    const tip = document.getElementById("fondosEvoTooltip");
    if (!tip) return;
    if (e.type === "mouseout"){ tip.style.display="none"; return; }

    const UMBRAL_PX = 10;
    let mejor = null, mejorDist = UMBRAL_PX;
    chart.data.datasets.forEach((ds,di)=>{
      const meta = chart.getDatasetMeta(di);
      if (!meta || meta.hidden) return;
      const pts = meta.data;
      for (let i=0; i<pts.length-1; i++){
        const p1=pts[i], p2=pts[i+1];
        if (p1.skip || p2.skip) continue;
        const {dist,t} = distanciaASegmento(e.x,e.y, p1.x,p1.y, p2.x,p2.y);
        if (dist < mejorDist){ mejorDist = dist; mejor = { ds, idx: t<0.5?i:i+1 }; }
      }
    });
    if (!mejor){ tip.style.display="none"; return; }
    const valor = mejor.ds.data[mejor.idx];
    const fmt = chart.__tickFmt ? chart.__tickFmt(valor) : valor;
    tip.innerHTML = `<span style="color:${mejor.ds.borderColor};">●</span> ${mejor.ds.label}: ${fmt}`;
    tip.style.display = "block";
    tip.style.left = (e.x+14)+"px";
    tip.style.top = (e.y-12)+"px";
  }
};

function renderFondosEvolucionChart(v){
  const { meses, fondosOrdenados, metrica, valorDe } = v;
  const esPct = metrica==="pct" || metrica==="acum";
  const colores = ["#4f8cff","#ff9f43","#37c993","#ff5d6c","#a78bfa","#38bdf8","#f472b6","#facc15","#94a3b8","#ef4444","#22d3ee","#d99a5b"];
  const datasets = fondosOrdenados.map((f,i)=>({
    label: f,
    data: meses.map((m,idx)=>valorDe(f,idx)),
    borderColor: colores[i%colores.length],
    backgroundColor: colores[i%colores.length],
    yAxisID: "y",
    spanGaps: true,
    tension:.25, pointRadius:2, pointHitRadius:8, pointHoverRadius:5, borderWidth:2
  }));
  /* rango comun para los dos ejes (izq y der), asi quedan sincronizados */
  const todosValores = datasets.flatMap(d=>d.data).filter(x=>x!==null&&x!==undefined);
  const minV = todosValores.length? Math.min(...todosValores) : 0;
  const maxV = todosValores.length? Math.max(...todosValores) : 1;
  const margen = Math.max(1,(maxV-minV))*0.08;
  const ejeMin = minV-margen, ejeMax = maxV+margen;
  const tickFmt = (v)=> esPct ? (Math.round(v*100)/100)+"%" : $$(v);

  if (chartFondosEvolucionRef) chartFondosEvolucionRef.destroy();
  chartFondosEvolucionRef = new Chart(document.getElementById("chFondosEvolucion"), {
    type:"line",
    data:{ labels: meses.map(m=>m.mes), datasets },
    plugins:[lineHoverPlugin],
    options:{
      responsive:true,
      maintainAspectRatio:false,
      events:["mousemove","mouseout","click"],
      plugins:{
        legend:{position:"bottom", labels:{color:"#8b99b8", boxWidth:10, font:{size:10}}},
        tooltip:{enabled:false}
      },
      scales:{
        x:{grid:{color:"#1f2c47"},ticks:{color:"#8b99b8"}},
        y:{position:"left", min:ejeMin, max:ejeMax, grid:{color:"#1f2c47"},ticks:{color:"#8b99b8", callback:tickFmt}},
        yDer:{position:"right", min:ejeMin, max:ejeMax, grid:{display:false},ticks:{color:"#8b99b8", callback:tickFmt}}
      }
    }
  });
  chartFondosEvolucionRef.__tickFmt = tickFmt;
}

  DATA = {saldoInicial, rows, weeksSorted, years};

  const ty = hoyDemo().getFullYear();
  const anosConMovimiento = years.filter(y => rows.some(r=>r.y===y && Math.abs(r.val)>10));
  anosConMovimiento.forEach(y=>{ if (y>=ty) VIEW.selYears.add(y); });
  if (!VIEW.selYears.size) anosConMovimiento.forEach(y=>VIEW.selYears.add(y));

  document.getElementById("updatedAt").textContent = "Datos de muestra (offline)";
  if (APP_TAB === "executive") renderExecutiveView(); else render();
}

/* Saldo a una fecha = saldo inicial + todos los Ingresos con fecha real <= esa fecha
   menos todos los Egresos con fecha real <= esa fecha. Sin pasar por semanas: asi siempre
   coincide con lo que muestran las tarjetas de Ingresos/Egresos para el mismo corte. */
function saldoAlFecha(fechaFin){
  let s = DATA.saldoInicial;
  DATA.rows.forEach(r=>{
    if (r.fecha > fechaFin) return;
    s += (r.concepto==="INGRESOS" ? r.val : -r.val);
  });
  return s;
}

/* ---------- Executive: resumen de liquidez para presentar al directorio ---------- */
function hoyMedianoche(){ const d = hoyDemo(); d.setHours(0,0,0,0); return d; }
function sumaIngresosEgresos(desde, hasta){
  let ing=0, egr=0;
  DATA.rows.forEach(r=>{
    if (r.fecha < desde || r.fecha > hasta) return;
    if (r.concepto==="INGRESOS") ing += r.val; else egr += r.val;
  });
  return {ing, egr};
}
/* el punto mas bajo que toca la caja dia a dia dentro del rango (no solo el valor final) */
function minSaldoEnRango(desde, hasta){
  let min = Infinity, fechaMin = new Date(desde);
  let dia = new Date(desde);
  while (dia <= hasta){
    const s = saldoAlFecha(dia);
    if (s < min){ min = s; fechaMin = new Date(dia); }
    dia = new Date(dia.getFullYear(), dia.getMonth(), dia.getDate()+1);
  }
  return { min, fecha: fechaMin };
}

function renderExecutiveView(){
  const app = document.getElementById("app");
  if (!DATA){ app.innerHTML = `<div class="state">Cargando…</div>`; return; }

  const hoy = hoyMedianoche();
  const cajaHoy = DATA.saldoInicial;
  const horizontes = [30,60,90];
  /* Sin piso de fecha "desde" en el PRIMER tramo: cualquier movimiento vencido (fecha de pago
     anterior a hoy) que todavia tenga saldo pendiente tiene que sumar igual, no solo lo que
     esta agendado desde hoy en adelante. El "hasta" de cada tramo si se respeta tal cual. */
  const SIN_PISO = new Date(2000,0,1);
  let cajaAcumulada = cajaHoy, desdeTramo = SIN_PISO;
  const cols = horizontes.map(dias=>{
    const hasta = new Date(hoy); hasta.setDate(hasta.getDate()+dias);
    const {ing,egr} = sumaIngresosEgresos(desdeTramo, hasta);
    const neto = ing - egr;
    const disponible = cajaAcumulada;
    const final = disponible + neto;
    cajaAcumulada = final;
    desdeTramo = new Date(hasta); desdeTramo.setDate(desdeTramo.getDate()+1);
    return { dias, hasta, ing, egr, neto, disponible, final };
  });
  /* el 90D de las tarjetas de arriba: mismo criterio, sin piso de fecha */
  const {ing:ingTotal90, egr:egrTotal90} = sumaIngresosEgresos(SIN_PISO, cols[2].hasta);
  const netoTotal90 = ingTotal90 - egrTotal90;

  const col90 = cols[2];
  const {min: minimoCaja, fecha: fechaMinimoCaja} = minSaldoEnRango(hoy, col90.hasta);

  const kpisHtml = `<div class="kpis" style="grid-template-columns:repeat(2,1fr);">
    <div class="kpi"><div class="label">Caja Actual</div><div class="value">${$$(cajaHoy)}</div></div>
    <div class="kpi"><div class="label">Caja Proyectada a 90D</div><div class="value ${col90.final<0?'neg':'pos'}">${$$(col90.final)}</div></div>
    <div class="kpi"><div class="label">Flujo Neto 90D</div><div class="value ${netoTotal90<0?'neg':'pos'}">${$$(netoTotal90)}</div></div>
    <div class="kpi"><div class="label">Mínimo de Caja (90D)</div><div class="value ${minimoCaja<0?'neg':'pos'}">${$$(minimoCaja)} <span style="font-size:12px;font-weight:600;color:var(--muted);">· ${fechaMinimoCaja.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"})}</span></div></div>
  </div>`;
  let html = "";

  /* Caja disponible por mes (proyectada), a futuro desde hoy */
  const mesesChart = [];
  for (let i=0;i<6;i++){
    const y = hoy.getFullYear(), m = hoy.getMonth()+i;
    const finMes = new Date(y, m+1, 0);
    mesesChart.push({ label: fmtMonth(finMes.getFullYear(), finMes.getMonth()), saldo: saldoAlFecha(finMes) });
  }

  html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;">
    <div>
      ${kpisHtml}
      <div class="panel" style="font-size:12px;">
        <h3 style="font-size:14px;letter-spacing:1px;text-transform:uppercase;">Liquidez — 90 Días</h3>
        <div class="pivot-wrap"><table class="pivot" style="font-size:12px;">
          <thead><tr>
            <th class="rowlabel"></th>
            <th>Hoy</th>
            ${cols.map(c=>`<th>${c.dias} Días</th>`).join("")}
          </tr></thead>
          <tbody>
            <tr><td class="rowlabel">Caja Disponible</td><td class="amt">${$$(cajaHoy)}</td>${cols.map(c=>`<td class="amt">${fmtBalance(c.disponible)}</td>`).join("")}</tr>
            <tr><td class="rowlabel">Ingresos Esperados</td><td class="amt"></td>${cols.map(c=>`<td class="amt">${fmtFlow(c.ing,true)}</td>`).join("")}</tr>
            <tr><td class="rowlabel">Egresos Esperados</td><td class="amt"></td>${cols.map(c=>`<td class="amt">${fmtFlow(c.egr,false)}</td>`).join("")}</tr>
            <tr><td class="rowlabel">Flujo Neto</td><td class="amt"></td>${cols.map(c=>`<td class="amt">${fmtBalance(c.neto)}</td>`).join("")}</tr>
            <tr class="saldo"><td class="rowlabel">Caja Final</td><td class="amt"></td>${cols.map(c=>`<td class="amt">${fmtBalance(c.final)}</td>`).join("")}</tr>
          </tbody>
        </table></div>
      </div>
      <div class="panel">
        <h3 style="font-size:15px;letter-spacing:1px;text-transform:uppercase;">Caja Disponible <small style="text-transform:none;letter-spacing:normal;font-weight:400;">proyección mes a mes</small></h3>
        <canvas id="chExecCaja" style="max-height:260px;"></canvas>
      </div>
    </div>
    <div class="panel">
      <div id="execFondosTablaWrap">${renderTablaFondosExecutive()}</div>
      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);">
        ${renderTabla12MesesExecutive()}

  </div>`;

  app.innerHTML = html;

  if (chartExecRef) chartExecRef.destroy();
  /* Linea de tendencia (regresion lineal simple) sobre los 6 puntos de Caja Disponible */
  function regresionLineal(valores){
    const n = valores.length;
    const sumX = valores.reduce((a,_,i)=>a+i,0);
    const sumY = valores.reduce((a,v)=>a+v,0);
    const sumXY = valores.reduce((a,val,i)=>a+i*val,0);
    const sumX2 = valores.reduce((a,_,i)=>a+i*i,0);
    const denom = (n*sumX2 - sumX*sumX) || 1;
    const b = (n*sumXY - sumX*sumY) / denom;
    const a = (sumY - b*sumX) / n;
    return valores.map((_,i)=> a + b*i);
  }
  const tendencia = regresionLineal(mesesChart.map(m=>m.saldo));

  chartExecRef = new Chart(document.getElementById("chExecCaja"), {

        { type:"line", label:"Tendencia", data: tendencia, order:1,
          borderColor:"#ff9f43", borderDash:[6,4], borderWidth:2, pointRadius:0, tension:0 }
      ]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{
        x:{grid:{color:"#1f2c47"},ticks:{color:"#8b99b8"}},
        y:{grid:{color:"#1f2c47"},ticks:{color:"#8b99b8"}}
      }
    }
  });
}

/* Rendimiento acumulado de los ULTIMOS 12 MESES, calculado por composicion (no el % acumulado
   de la hoja Resumen, que arranca fijo en ene-25). Base 100 = el mes anterior al inicio de la
   ventana de 12 meses; cada % mensual se va componiendo sobre esa base, hacia adelante. */
function acumuladoNMeses(fondo, n){
  const meses = FONDOS_DATA.meses;
  if (!meses.length) return null;
  const ultimosN = meses.slice(-n);
  let acc = 100, huboDato = false;
  ultimosN.forEach(m=>{
    const pct = m.datos[fondo] ? m.datos[fondo].pct : null;
    if (pct===null || pct===undefined) return;
    acc = acc * (1 + pct/100);
    huboDato = true;
  });
  return huboDato ? (acc - 100) : null;
}
let EXEC_ORDEN_NMESES = 12; /* con cual columna (3, 6 o 12) esta ordenada la tabla ahora */
function ordenarTabla3612(n){
  EXEC_ORDEN_NMESES = n;

/* Un período "tiene movimiento" si al menos una fila ahí tiene |valor| > 10 (descarta residuos de centavos) */
const UMBRAL = 10;
function tieneMovimiento(pred){
  return DATA.rows.some(r => pred(r) && Math.abs(r.val) > UMBRAL);
}
function aniosDisponibles(){
  return DATA.years.filter(y => tieneMovimiento(r=>r.y===y));
}
function mesesDisponibles(){
  const set = new Set();
  DATA.rows.forEach(r=>{
    if (!VIEW.selYears.has(r.y)) return;
    set.add(ymKey(r.y,r.m));
  });
  return [...set].map(k=>{ const [y,m]=k.split("-").map(Number); return {y,m}; })
    .filter(({y,m}) => tieneMovimiento(r=>r.y===y && r.m===m))
    .sort((a,b)=>(a.y-b.y)||(a.m-b.m));
}
function semanasDisponibles(){
  const monthsSel = VIEW.selMonths.size ? [...VIEW.selMonths] : mesesDisponibles().map(x=>ymKey(x.y,x.m));
  const monthRanges = monthsSel.map(k=>{
    const [y,m] = k.split("-").map(Number);
    return {start: new Date(y,m,1), end: new Date(y,m+1,0,23,59,59)};
  });
  return DATA.weeksSorted.filter(k=>{
    const d = parseIsoLocal(k);
    const fin = new Date(d); fin.setDate(fin.getDate()+6);
    /* una semana entra si tiene AL MENOS UN DIA dentro de alguno de los meses filtrados,
       aunque haya empezado en el mes anterior (ej: semana del 31/8 al 6/9 aparece
       tanto en agosto como en septiembre). */
    const solapa = monthRanges.some(r => d <= r.end && fin >= r.start);
    if (!solapa) return false;
    return tieneMovimiento(r => isoKey(r.week)===k);
  });
}
function diasDisponibles(){
  const weeksSel = VIEW.selWeeks.size ? [...VIEW.selWeeks] : semanasDisponibles();
  const out = [];
  weeksSel.forEach(wk=>{
    const inicio = parseIsoLocal(wk);
    for (let i=0;i<7;i++){
      const d = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate()+i);
      if (tieneMovimiento(r => isoLocalDate(r.fecha)===isoLocalDate(d))) out.push({dia:isoLocalDate(d), wk});
    }
  });
  return out;
}

function getColumns(){
  if (VIEW.granularity === "year"){
    return [...VIEW.selYears].sort((a,b)=>a-b).map(y => {
      const start = new Date(y,0,1), end = new Date(y,11,31);
      return { label:String(y), y, m:null, wk:null, dia:null, start, end, pred: r => r.y===y, saldo: saldoAlFecha(end) };
    });
  }
  if (VIEW.granularity === "month"){
    const disponibles = mesesDisponibles();
    const activos = VIEW.selMonths.size ? disponibles.filter(x=>VIEW.selMonths.has(ymKey(x.y,x.m))) : disponibles;
    return activos.map(({y,m}) => {
      const start = new Date(y,m,1), end = new Date(y,m+1,0);
      return { label: fmtMonth(y,m), y, m, wk:null, dia:null, start, end, pred: r => r.y===y && r.m===m, saldo: saldoAlFecha(end) };
    });
  }
  if (VIEW.granularity === "week"){
    const disponibles = semanasDisponibles();
    const activas = VIEW.selWeeks.size ? disponibles.filter(k=>VIEW.selWeeks.has(k)) : disponibles;
    return activas.map(k=>{
      const d = parseIsoLocal(k);
      const fin = new Date(d); fin.setDate(fin.getDate()+6);
      return { label:"Del "+fmtWeek(d)+" al "+fmtWeek(fin), y:d.getFullYear(), m:d.getMonth(), wk:k, dia:null, start:d, end:fin,
        pred: r => isoKey(r.week)===k, saldo: saldoAlFecha(fin) };
    });
  }
  /* granularity === "day" */
  const disponibles = diasDisponibles();
  const activas = VIEW.selDays.size ? disponibles.filter(x=>VIEW.selDays.has(x.dia)) : disponibles;
  return activas.map(({dia,wk})=>{
    const [y,m,dd] = dia.split("-").map(Number);
    const d = new Date(y, m-1, dd);
    return { label: fmtDia(d), y:d.getFullYear(), m:d.getMonth(), wk, dia, start:d, end:d,
      pred: r => isoLocalDate(r.fecha)===dia, saldo: saldoAlFecha(d) };
  });
}

function sumFor(pred, concepto, sub, detalle){
  let s=0;
  DATA.rows.forEach(r=>{
    if (r.concepto!==concepto) return;
    if (sub!==undefined && r.sub!==sub) return;
    if (detalle!==undefined && r.detalle!==detalle) return;
    if (pred(r)) s += r.val;
  });
  return s;
}

let chartRef = null;
let chartCompRef = null;

function chip(label, active, onclick, extraClass){

/* Un solo clic recorre una secuencia de 11 pasos:
   "año único" -> "todos los años" -> "todos los meses (de ese año)" -> "todas las semanas
   (de ese mes)" -> "todos los días (de esa semana)" -> "ese día único" -> vuelve a "todos
   los días" -> "esa semana única" -> "todas las semanas" -> "ese mes único" -> "todos los
   meses" -> "año único" -> (repite). Cada paso usa el año/mes/semana/día de la columna que
   se clickeo para saber hacia donde ir. */
let __cicloIdx = 0;
function headerClick(y, m, wk, dia){
  switch(__cicloIdx){
    case 0: // año único -> todos los años
      VIEW.granularity = "year";
      VIEW.selYears = new Set(aniosDisponibles());
      break;
    case 1: // todos los años -> todos los meses del año clickeado
      VIEW.granularity = "month";
      VIEW.selYears = new Set([y]);
      VIEW.selMonths = new Set();
      break;
    case 2: // todos los meses -> todas las semanas del mes clickeado
      VIEW.granularity = "week";
      VIEW.selYears = new Set([y]);
      VIEW.selMonths = new Set([ymKey(y,m)]);
      VIEW.selWeeks = new Set();
      break;
    case 3: // todas las semanas -> todos los días de la semana clickeada
      VIEW.granularity = "day";
      if (wk) VIEW.selWeeks = new Set([wk]);
      VIEW.selDays = new Set();
      break;
    case 4: // todos los días -> ese día único
      if (dia) VIEW.selDays = new Set([dia]);
      break;
    case 5: // ese día único -> todos los días de nuevo (misma semana)
      VIEW.selDays = new Set();
      break;
    case 6: // todos los días (subiendo) -> esa semana única
      VIEW.granularity = "week";
      if (wk) VIEW.selWeeks = new Set([wk]);
      break;
    case 7: // esa semana única -> todas las semanas de nuevo
      VIEW.selWeeks = new Set();
      break;
    case 8: // todas las semanas (subiendo) -> ese mes único
      VIEW.granularity = "month";
      VIEW.selMonths = new Set([ymKey(y,m)]);
      break;
    case 9: // ese mes único -> todos los meses de nuevo
      VIEW.selMonths = new Set();
      break;
    case 10: // todos los meses (subiendo) -> año único
      VIEW.granularity = "year";
      VIEW.selYears = new Set([y]);
      break;
  }
  __cicloIdx = (__cicloIdx + 1) % 11;
  render();
}

/* Fila de Top gastos / Top ingresos, con detalle desplegable a un clic (Detalle, Factura,
   Fecha de pago, Monto de cada movimiento real que compone ese sub-concepto). */
function renderTopRow(key, total, base, esIngreso, concepto, sub){
  const pct = base ? ((Math.abs(total)/base)*100).toFixed(1) : "0.0";
  const expandKey = "top|"+esIngreso+"|"+concepto+"|"+sub;
  const expanded = VIEW.expandedTop.has(expandKey);
  let html = `<tr onclick="toggleTop('${expandKey.replace(/'/g,"\\'")}')" style="cursor:pointer;">
    <td class="rowlabel">${expanded?'▾ ':''}${key}</td><td class="amt">${fmtFlow(total,esIngreso)}</td><td class="amt">${pct}%</td></tr>`;
  if (expanded){
    const cols_ = window.__colsActuales || [];
    const txs = DATA.rows.filter(r=>r.concepto===concepto && r.sub===sub && cols_.some(c=>c.pred(r)))
      .filter(r=>Math.abs(r.val)>1)
      .sort((a,b)=>a.fecha-b.fecha);
    html += `<tr><td class="rowlabel" colspan="3" style="padding:4px 12px 10px 20px;">
      <table class="pivot" style="width:100%;">
        <thead><tr>
          <th class="rowlabel" style="font-size:10px;">Detalle</th>
          <th style="font-size:10px;text-align:left;">Factura</th>
          <th style="font-size:10px;text-align:left;">Fecha de pago</th>
          <th style="font-size:10px;">Días al Vto</th>
          <th style="font-size:10px;">Monto</th>
        </tr></thead>
        <tbody>
          ${txs.length ? txs.map(x=>{
              const hoy0 = hoyDemo(); hoy0.setHours(0,0,0,0);
              const fx0 = new Date(x.fecha.getFullYear(), x.fecha.getMonth(), x.fecha.getDate());
              const diasVto = Math.round((fx0 - hoy0) / 86400000);
              const diasTxt = diasVto < 0 ? `<span class="neg">Vencido hace ${Math.abs(diasVto)} días</span>` : (diasVto===0 ? `<span class="neg">Hoy</span>` : `${diasVto} días`);
              return `<tr class="${esIngreso?'pos':'neg'}">
              <td class="rowlabel">${x.detalle}</td>
              <td>${x.factura||"—"}</td>
              <td>${x.fecha.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"})}</td>
              <td class="amt">${diasTxt}</td>
              <td class="amt">${fmtFlow(x.val, esIngreso)}</td>
            </tr>`;
            }).join("") : `<tr><td class="rowlabel" colspan="5" style="color:var(--muted)">Sin movimientos</td></tr>`}
        </tbody>
      </table>
    </td></tr>`;
  }
  return html;
}
function toggleTop(key){ if (VIEW.expandedTop.has(key)) VIEW.expandedTop.delete(key); else VIEW.expandedTop.add(key); render(); }

function render(){
  const app = document.getElementById("app");

  let f = `<div class="filters">`;
  f += `<div class="filter-row">
    <span class="filter-label">Ver por</span>
    <div class="seg">
      <button class="${VIEW.granularity==='year'?'active':''}" onclick="setGran('year')">Año</button>
      <button class="${VIEW.granularity==='month'?'active':''}" onclick="setGran('month')">Mes</button>
      <button class="${VIEW.granularity==='week'?'active':''}" onclick="setGran('week')">Semana</button>
      <button class="${VIEW.granularity==='day'?'active':''}" onclick="setGran('day')">Día</button>
    </div>
  </div>`;

  f += `<div class="filter-row"><span class="filter-label">Año(s)</span><div class="chips">`;
  aniosDisponibles().forEach(y=>{ f += chip(y, VIEW.selYears.has(y), `toggleYear(${y})`); });
  f += `</div></div>`;

  if (VIEW.granularity!=="year"){
    const disp = mesesDisponibles();
    f += `<div class="filter-row"><span class="filter-label">Mes(es)</span><div class="chips">`;
    f += chip("Todos", VIEW.selMonths.size===0, `clearMonths()`, "all");
    disp.forEach(({y,m})=>{
      const k = ymKey(y,m);
      f += chip(fmtMonth(y,m), VIEW.selMonths.has(k), `toggleMonth('${k}')`);
    });
    f += `</div></div>`;
  }
  if (VIEW.granularity==="week" || VIEW.granularity==="day"){
    const disp = semanasDisponibles();
    f += `<div class="filter-row"><span class="filter-label">Semana(s)</span><div class="chips">`;
    f += chip("Todas", VIEW.selWeeks.size===0, `clearWeeks()`, "all");
    disp.forEach(k=>{
      const d = parseIsoLocal(k);
      const fin = new Date(d); fin.setDate(fin.getDate()+6);
      f += chip("Del "+fmtWeek(d)+" al "+fmtWeek(fin), VIEW.selWeeks.has(k), `toggleWeek('${k}')`);
    });
    f += `</div></div>`;
  }
  if (VIEW.granularity==="day"){
    const disp = diasDisponibles();
    f += `<div class="filter-row"><span class="filter-label">Día(s)</span><div class="chips">`;
    f += chip("Todos", VIEW.selDays.size===0, `clearDays()`, "all");
    disp.forEach(({dia})=>{
      const [yy,mm,ddn] = dia.split("-").map(Number);
      const dd = new Date(yy,mm-1,ddn);
      f += chip(fmtDia(dd), VIEW.selDays.has(dia), `toggleDay('${dia}')`);
    });
    f += `</div></div>`;
  }
  f += `</div>`;

  const cols = getColumns();
  window.__colsActuales = cols;
  if (!cols.length){
    app.innerHTML = f + `<div class="empty-cols">No hay períodos para mostrar con estos filtros.</div>`;
    return;
  }

  let totalIng=0, totalEgr=0;
  cols.forEach(c=>{
    DATA.rows.forEach(r=>{
      if (!c.pred(r)) return;
      if (r.concepto==="INGRESOS") totalIng += r.val; else totalEgr += r.val;
    });
  });
  const saldoFinal = cols[cols.length-1].saldo;
  const fechaFinal = cols[cols.length-1].end.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"});
  const fechaInicioRango = cols[0].start.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"});
  const fechaFinRango = cols[cols.length-1].end.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"});
  const rangoTexto = fechaInicioRango===fechaFinRango ? fechaInicioRango : `Del ${fechaInicioRango} al ${fechaFinRango}`;
  const primeraNeg = cols.find(c=>c.saldo<0);
  /* Buscamos el DIA exacto (no la columna/semana) en que el saldo cruza a negativo,
     recorriendo dia por dia dentro del rango del filtro actual. */
  let diaNegativo = null, saldoDiaNegativo = null;
  if (primeraNeg){
    let cursor = new Date(cols[0].start);
    const limite = cols[cols.length-1].end;
    while (cursor <= limite){
      const s = saldoAlFecha(cursor);
      if (s < 0){ diaNegativo = new Date(cursor); saldoDiaNegativo = s; break; }
      cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate()+1);
    }
  }

  let html = f;
  html += `<div class="kpis">
    <div class="kpi"><div class="label">Saldo Banco Galicia</div><div class="value">${$$(DATA.saldoInicial)}</div></div>
    <div class="kpi"><div class="label">Ingresos al ${fechaFinal}</div><div class="value pos">${$$(totalIng)}</div></div>
    <div class="kpi"><div class="label">Egresos al ${fechaFinal}</div><div class="value neg">${$$(totalEgr)}</div></div>
    <div class="kpi"><div class="label">Saldo al ${fechaFinal}</div><div class="value ${saldoFinal<0?'neg':'pos'}">${$$(saldoFinal)}</div></div>

  html += primeraNeg

  CONCEPTOS.forEach(concepto=>{

    if (expanded){

          if (txs.length){

                  ${txs.map(x=>`<tr>
                    <td class="rowlabel">${x.detalle}</td>

            html += `<tr class="detalle"><td class="rowlabel">— sin detalle —</td>${cols.map(()=>`<td class="amt">—</td>`).join("")}<td class="amt">—</td></tr>`;

  html += `</tbody></table></div></div>`;

  html += `<div class="panel"><h3>Ingresos vs Egresos vs Disponible <small>barras/línea izquierda: flujo del período — línea derecha: saldo disponible día a día (rojo si es negativo). Pasá el mouse para ver el valor de cada día.</small></h3><canvas id="chFlow"></canvas></div>`;

  const EGRESO_CONCEPTOS_BASE = CONCEPTOS.filter(c=>c!=="INGRESOS");
  const EGRESO_COLORS_BASE = ["#ef4444","#f97316","#a855f7","#38bdf8","#eab308","#ec4899","#94a3b8"];
  const egresoOrden = EGRESO_CONCEPTOS_BASE
    .map((c,i)=>({concepto:c, color:EGRESO_COLORS_BASE[i], total: cols.reduce((a,col)=>a+sumFor(col.pred,c),0)}))

  const EGRESO_COLORS = egresoOrden.map(x=>x.color);
  const egresoPorConcepto = egresoOrden.map(x=>x.total);
  const totalEgresoComp = egresoPorConcepto.reduce((a,v)=>a+v,0);
  const subEgresosTot = {};
  const subIngresosTot = {};
  DATA.rows.forEach(r=>{
    const key = r.sub;
    let v = 0;
    cols.forEach(c=>{ if (c.pred(r)) v += r.val; });
    if (r.concepto==="INGRESOS") subIngresosTot[key] = (subIngresosTot[key]||0) + v;
    else {
      const key2 = r.concepto+" — "+r.sub;
      subEgresosTot[key2] = (subEgresosTot[key2]||0) + v;
    }
  });
  const topSub = Object.entries(subEgresosTot).filter(([,v])=>Math.abs(v)>1)
    .sort((a,b)=>b[1]-a[1]);
  const topSubIng = Object.entries(subIngresosTot).filter(([,v])=>Math.abs(v)>1)
    .sort((a,b)=>b[1]-a[1]);

  /* Movimientos del rango de fechas elegido (Desde/Hasta) */
  const [dy1,dm1,dd1] = VIEW.diaDesde.split("-").map(Number);
  const [dy2,dm2,dd2] = VIEW.diaHasta.split("-").map(Number);
  const rangoDesde = new Date(dy1, dm1-1, dd1);
  const rangoHasta = new Date(dy2, dm2-1, dd2, 23,59,59);
  const movimientosDelDia = DATA.rows
    .filter(r=>r.fecha>=rangoDesde && r.fecha<=rangoHasta)
    .filter(r=>Math.abs(r.val)>1)
    .sort((a,b)=>a.fecha-b.fecha);

  const conceptListHTML = EGRESO_CONCEPTOS.map((c,i)=>{
    const v = egresoPorConcepto[i];
    const pct = totalEgresoComp ? (v/totalEgresoComp*100) : 0;
    return `<div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:4px;">
        <span style="display:flex;align-items:center;gap:8px;"><span style="width:10px;height:10px;border-radius:3px;background:${EGRESO_COLORS[i%EGRESO_COLORS.length]};display:inline-block;"></span>${c}</span>
        <span style="color:var(--muted);">${fmtFlow(v,false)} · ${pct.toFixed(1)}%</span>
      </div>
      <div style="background:var(--panel-2);border-radius:99px;height:6px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:${EGRESO_COLORS[i%EGRESO_COLORS.length]};"></div>
      </div>
    </div>`;
  }).join("");

  html += `<div class="panel">
    <div style="display:grid;grid-template-columns:2fr 3fr;gap:28px;">
      <div style="border-right:1px solid var(--border);padding-right:28px;min-width:0;">
        <h3>Composición de gastos <small>solo egresos (sin Ingresos), por Concepto — del filtro actual</small></h3>
        <div style="display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center;">
          <div style="position:relative;">
            <canvas id="chComp" style="max-height:190px;"></canvas>
            <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;">
              <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;">Total</div>
              <div style="font-size:14px;font-weight:800;">${$$(totalEgresoComp)}</div>
            </div>
          </div>
          <div>${conceptListHTML}</div>
        </div>
      </div>
      <div style="min-width:0;">
        <h3>Movimientos del día <small>elegí una fecha para ver exactamente qué se movió ese día</small></h3>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;">
          <label style="font-size:11px;color:var(--muted);">Desde
            <input type="date" id="diaDesdePicker" value="${VIEW.diaDesde}" style="display:block;background:var(--accent);border:2px solid #7aabff;color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;margin-top:3px;" onchange="cambiarDiaDesde(this.value)">

          <label style="font-size:11px;color:var(--muted);">Hasta
            <input type="date" id="diaHastaPicker" value="${VIEW.diaHasta}" style="display:block;background:var(--accent);border:2px solid #7aabff;color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;margin-top:3px;" onchange="cambiarDiaHasta(this.value)">
          </label>
        </div>
        <div class="pivot-wrap" style="overflow-x:hidden;">
          <table class="pivot" style="table-layout:fixed;width:100%;">
            <colgroup>
              <col style="width:13%;"><col style="width:15%;"><col><col style="width:9%;"><col style="width:12%;"><col style="width:16%;">
            </colgroup>
            <thead><tr><th class="rowlabel">Concepto</th><th class="rowlabel">Sub-Concepto</th><th class="rowlabel">Detalle</th><th class="rowlabel">Factura</th><th class="rowlabel">Fecha de Pago</th><th>Monto</th></tr></thead>
            <tbody>
          ${movimientosDelDia.length ? movimientosDelDia.map(r=>{
              const cls = r.concepto==="INGRESOS" ? "pos" : "neg";
              return `<tr class="${cls}"><td class="rowlabel" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${r.concepto}">${r.concepto}</td><td class="rowlabel" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${r.sub}">${r.sub}</td><td class="rowlabel" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${r.detalle}">${r.detalle}</td><td class="rowlabel" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.factura||"—"}</td><td class="rowlabel" style="white-space:nowrap;">${r.fecha.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"})}</td><td class="amt" style="white-space:nowrap;">${fmtFlow(r.val, r.concepto==="INGRESOS")}</td></tr>`;
            }).join("")
            : `<tr><td class="rowlabel" colspan="6" style="color:var(--muted)">Sin movimientos en ese rango</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--border);">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;">
        <div style="border-right:1px solid var(--border);padding-right:28px;">
          <h3>Top gastos <small>${rangoTexto} — clic para el detalle</small></h3>
          <div class="pivot-wrap"><table class="pivot"><thead><tr><th class="rowlabel">Sub-Concepto</th><th>Monto</th><th>%</th></tr></thead><tbody>
            ${topSub.map(([k,v])=>{
              const [conc, sub] = k.split(" — ");
              return renderTopRow(k, v, totalEgresoComp, false, conc, sub);
            }).join("")}
            <tr class="saldo"><td class="rowlabel">TOTAL</td><td class="amt">${fmtFlow(totalEgresoComp,false)}</td><td class="amt">100.0%</td></tr>
          </tbody></table></div>
        </div>
        <div>
          <h3>Top ingresos <small>${rangoTexto} — clic para el detalle</small></h3>
          <div class="pivot-wrap"><table class="pivot"><thead><tr><th class="rowlabel">Sub-Concepto</th><th>Monto</th><th>%</th></tr></thead><tbody>
            ${topSubIng.map(([k,v])=>renderTopRow(k, v, totalIng, true, "INGRESOS", k)).join("")}
            <tr class="saldo"><td class="rowlabel">TOTAL</td><td class="amt">${fmtFlow(totalIng,true)}</td><td class="amt">100.0%</td></tr>
          </tbody></table></div>
        </div>
      </div>
    </div>
  </div>`;

  app.innerHTML = html;

  if (chartRef) chartRef.destroy();
  if (chartCompRef) chartCompRef.destroy();

  const ctx = document.getElementById("chFlow");
  const egresosData = cols.map(c=>EGRESO_CONCEPTOS.reduce((a,concepto)=>a+sumFor(c.pred,concepto),0));
  const ingresosData = cols.map(c=>sumFor(c.pred, "INGRESOS"));
  const saldoData = cols.map(c=>c.saldo);

  /* Alinear el cero de ambos ejes: sin esto, un saldo negativo puede verse "arriba" del cero
     visualmente, porque cada eje tiene su propia escala independiente. Si en el período filtrado
     no hay NINGÚN valor negativo, no forzamos margen extra debajo del cero: el eje arranca
     limpio en cero (la línea de cero se dibuja igual, justo en el borde). */
  const rightMax0 = Math.max(0, ...saldoData);
  const rightMin0 = Math.min(0, ...saldoData);
  const rightRange0 = (rightMax0 - rightMin0) || 1;
  const fracBelow = rightMin0 < 0 ? (-rightMin0 / rightRange0) : 0;
  const rightMax = rightMax0;
  const rightMin = -(fracBelow/(1-fracBelow||1)) * rightMax;
  const leftMax = Math.max(1, ...egresosData, ...ingresosData);
  const leftMin = -(fracBelow/(1-fracBelow||1)) * leftMax;

  /* Dibuja la linea de cero exactamente en su posicion real, con etiqueta "0" para que no
     haya dudas de donde esta (a veces queda cerca del borde y se puede confundir). */
  const zeroLinePlugin = {
    id:"zeroLine",
    afterDraw(chart){
      const {ctx, chartArea, scales} = chart;
      const y0 = scales.y.getPixelForValue(0);
      if (y0 < chartArea.top || y0 > chartArea.bottom) return;
      ctx.save();
      ctx.strokeStyle = "#e7ecf7";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(chartArea.left, y0);
      ctx.lineTo(chartArea.right, y0);
      ctx.stroke();
      ctx.fillStyle = "#0b1220";
      ctx.fillRect(chartArea.left-2, y0-8, 22, 16);
      ctx.fillStyle = "#e7ecf7";
      ctx.font = "700 10px Segoe UI, Roboto, sans-serif";
      ctx.textBaseline = "middle";
      ctx.fillText("0", chartArea.left+2, y0);
      ctx.restore();
    }
  };

  function roundRect(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
  }
  /* Recorrer la linea de Disponible con el mouse, DIA A DIA, sin cambiar el eje X (que
     sigue siendo por periodo del filtro): interpola en que dia real del periodo estas
     parado segun la posicion del mouse dentro de esa columna, y busca el saldo real de ese dia. */
  let crosshairX = null;
  const saldoCrosshairPlugin = {
    id:"saldoCrosshair",
    afterEvent(chart, args){
      const t = args.event.type;
      if (t==="mousemove"){ crosshairX = args.event.x; args.changed = true; }
      else if (t==="mouseout"){ crosshairX = null; args.changed = true; }
    },
    afterDraw(chart){
      if (crosshairX==null) return;
      const {ctx: c, chartArea, scales} = chart;
      if (crosshairX < chartArea.left || crosshairX > chartArea.right) return;
      /* scales.x.getValueForPixel() en un eje de categorias redondea siempre al centro de la
         columna (no da posicion continua) -> por eso antes quedaba pegado al medio del mes o
         saltaba semana completa. Calculamos la posicion continua a mano con los pixeles reales. */
      const px0 = scales.x.getPixelForValue(0);
      const spacing = cols.length>1 ? (scales.x.getPixelForValue(1)-px0) : (chartArea.right-chartArea.left);
      const idxFloat = spacing ? (crosshairX-px0)/spacing : 0;
      const idx = Math.max(0, Math.min(cols.length-1, Math.round(idxFloat)));
      const col = cols[idx];
      const frac = Math.max(0, Math.min(1, idxFloat - idx + 0.5));
      const totalDays = Math.max(1, Math.round((col.end-col.start)/86400000));
      const dia = new Date(col.start.getFullYear(), col.start.getMonth(), col.start.getDate()+Math.round(frac*totalDays));
      const saldoDia = saldoAlFecha(dia);

      c.save();
      c.strokeStyle = "rgba(231,236,247,.35)";
      c.lineWidth = 1; c.setLineDash([4,3]);
      c.beginPath(); c.moveTo(crosshairX, chartArea.top); c.lineTo(crosshairX, chartArea.bottom); c.stroke();
      c.restore();

      const label = dia.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"}) + "   " + $$(saldoDia);
      c.save();
      c.font = "700 12px Segoe UI, Roboto, sans-serif";
      const padding = 9;
      const textW = c.measureText(label).width;
      let boxX = crosshairX + 12;
      if (boxX + textW + padding*2 > chartArea.right) boxX = crosshairX - textW - padding*2 - 12;
      /* La etiqueta sigue la altura real del punto en la linea (no un lugar fijo), asi no
         tapa lo que haya justo ahi arriba (por ej. el valor de Ingresos de ese punto). */
      const yPunto = scales.y1.getPixelForValue(saldoDia);
      let boxY = yPunto - 26 - 14;
      if (boxY < chartArea.top + 4) boxY = yPunto + 14;
      boxY = Math.max(chartArea.top+4, Math.min(chartArea.bottom-30, boxY));
      c.fillStyle = "rgba(17,26,46,.96)";
      c.strokeStyle = saldoDia<0 ? "#ff5d6c" : "#4f8cff";
      c.lineWidth = 1.5;
      roundRect(c, boxX, boxY, textW+padding*2, 26, 7);
      c.fill(); c.stroke();
      c.fillStyle = saldoDia<0 ? "#ff8992" : "#e7ecf7";
      c.textBaseline = "middle";
      c.fillText(label, boxX+padding, boxY+13);
      c.restore();
    }
  };

  chartRef = new Chart(ctx, {
    plugins:[zeroLinePlugin, saldoCrosshairPlugin],
    data:{
      labels:cols.map(c=>c.label),
      datasets:[
        {
          type:"bar", label:"Egresos", order:3,
          data: egresosData, backgroundColor:"#ff5d6c", borderRadius:4, yAxisID:"y"
        },
        {
          type:"line", label:"Ingresos", order:2,
          data: ingresosData,
          borderColor:"#37c993", backgroundColor:"#37c993", tension:.3, pointRadius:5, borderWidth:3, yAxisID:"y"
        },
        {
          type:"line", label:"Disponible (saldo)", order:1,
          data: saldoData,
          borderColor:"#4f8cff", backgroundColor:"rgba(79,140,255,.08)",
          tension:.25, pointRadius:4, pointHoverRadius:6, borderWidth:2.5, fill:false, yAxisID:"y1",
          segment:{borderColor:ctx=>ctx.p0.parsed.y<0||ctx.p1.parsed.y<0?"#ff5d6c":"#4f8cff"}
        }
      ]
    },
    options:{
      interaction:{mode:"nearest", intersect:true},
      plugins:{
        legend:{labels:{color:"#8b99b8", boxWidth:12, font:{size:12}}},
        tooltip:{callbacks:{label:(c)=>`${c.dataset.label}: ${$$(c.parsed.y)}`}}
      },
      scales:{
        x:{grid:{color:"#1f2c47"},ticks:{color:"#8b99b8"}},
        y:{position:"left", min:leftMin, max:leftMax,
           grid:{color:"#1f2c47"},
           ticks:{color:"#8b99b8"}, title:{display:true,text:"Ingresos / Egresos del período",color:"#8b99b8",font:{size:10.5}}},
        y1:{position:"right", min:rightMin, max:rightMax,
           grid:{drawOnChartArea:false},
           ticks:{color:"#4f8cff"}, title:{display:true,text:"Disponible (saldo acumulado)",color:"#4f8cff",font:{size:10.5}}}
      }
    }
  });

  const ctxComp = document.getElementById("chComp");
  chartCompRef = new Chart(ctxComp, {
    type:"doughnut",
    data:{labels:EGRESO_CONCEPTOS, datasets:[{data:egresoPorConcepto, backgroundColor:EGRESO_COLORS, borderColor:"#111a2e", borderWidth:2}]},
    options:{
      cutout:"68%",
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:(ctx)=>{
          const v = ctx.parsed; const pct = totalEgresoComp ? (v/totalEgresoComp*100).toFixed(1) : "0.0";
          return `${ctx.label}: ${$$(v)} (${pct}%)`;
        }}}
      }
    }
  });
}

function setGran(g){
  /* No borro selMonths/selWeeks/selDays: cambiar el nivel de "Ver por" (Mes/Semana/Día) no
     tiene que perder lo que ya estaba filtrado (ej. Año 2026 + Agosto elegido, y despues
     paso a ver por Semana o Día — esa selección se mantiene, no vuelve a "Todos"). */
  VIEW.granularity=g;
  __cicloIdx = g==="year" ? 1 : g==="month" ? 2 : g==="week" ? 3 : 4; /* asi el proximo clic continua la secuencia con sentido */
  render();
}
function toggleYear(y){ if (VIEW.selYears.has(y)) VIEW.selYears.delete(y); else VIEW.selYears.add(y); VIEW.selMonths=new Set(); VIEW.selWeeks=new Set(); VIEW.selDays=new Set(); render(); }
function toggleMonth(k){ if (VIEW.selMonths.has(k)) VIEW.selMonths.delete(k); else VIEW.selMonths.add(k); VIEW.selWeeks=new Set(); VIEW.selDays=new Set(); render(); }
function clearMonths(){ VIEW.selMonths=new Set(); VIEW.selWeeks=new Set(); VIEW.selDays=new Set(); render(); }
function toggleWeek(k){ if (VIEW.selWeeks.has(k)) VIEW.selWeeks.delete(k); else VIEW.selWeeks.add(k); VIEW.selDays=new Set(); render(); }
function clearWeeks(){ VIEW.selWeeks=new Set(); VIEW.selDays=new Set(); render(); }
function toggleDay(d){ if (VIEW.selDays.has(d)) VIEW.selDays.delete(d); else VIEW.selDays.add(d); render(); }
function clearDays(){ VIEW.selDays=new Set(); render(); }
function toggleNode(k){ if (VIEW.expanded.has(k)) VIEW.expanded.delete(k); else VIEW.expanded.add(k); render(); }
/* "Hasta" copia siempre lo que se elige en "Desde" -> por defecto se ve un solo dia.
   Si despues el usuario toca "Hasta" a mano, queda un rango, hasta que vuelva a tocar "Desde". */
function cambiarDiaDesde(v){ VIEW.diaDesde = v; VIEW.diaHasta = v; render(); }
function cambiarDiaHasta(v){ VIEW.diaHasta = v; render(); }

window.setGran=setGran; window.toggleYear=toggleYear; window.toggleMonth=toggleMonth;
window.clearMonths=clearMonths; window.toggleWeek=toggleWeek; window.clearWeeks=clearWeeks;
window.toggleDay=toggleDay; window.clearDays=clearDays;
window.toggleNode=toggleNode; window.toggleTop=toggleTop; window.cambiarDiaDesde=cambiarDiaDesde; window.cambiarDiaHasta=cambiarDiaHasta; window.headerClick=headerClick;
window.switchTab=switchTab; window.actualizarActivo=actualizarActivo; window.setFondosMetrica=setFondosMetrica;
window.setFondosEvolucionMetrica=setFondosEvolucionMetrica;
window.rotarExecFondoMetrica=rotarExecFondoMetrica;
window.ordenarTabla3612=ordenarTabla3612;
window.toggleFondoYear=toggleFondoYear; window.toggleFondoMonth=toggleFondoMonth; window.clearFondoMonths=clearFondoMonths;

/* Arrastrar con el mouse para desplazar las tablas horizontalmente (ademas del scroll
   normal). Se engancha una sola vez sobre document, asi funciona aunque las tablas se
   vuelvan a dibujar en cada render(). Un clic simple (sin mover el mouse) sigue funcionando
   igual para los encabezados que profundizan el filtro. */
let __dragState = null;
document.addEventListener("mousedown", (e)=>{
  const wrap = e.target.closest(".pivot-wrap");
  if (!wrap) return;
  __dragState = { wrap, startX: e.pageX, startY: e.pageY, scrollLeft: wrap.scrollLeft, scrollTop: wrap.scrollTop, moved:false };
  wrap.classList.add("dragging");
});
document.addEventListener("mousemove", (e)=>{
  if (!__dragState) return;
  const dx = e.pageX - __dragState.startX;
  const dy = e.pageY - __dragState.startY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) __dragState.moved = true;
  if (__dragState.moved){
    __dragState.wrap.scrollLeft = __dragState.scrollLeft - dx;
    __dragState.wrap.scrollTop = __dragState.scrollTop - dy;
    e.preventDefault();
  }
});
function __endDrag(){
  /* Si hubo un arrastre real, el navegador dispara igual un "click" al soltar el mouse
     (aunque la intencion haya sido arrastrar, no clickear). Ese click fantasma es el que
     terminaba llamando a headerClick/toggleNode y reconstruyendo la tabla, reseteando el
     scroll a cero. Lo suprimimos, una sola vez, justo despues de un arrastre real. */
  if (__dragState && __dragState.moved){
    const suprimirClick = (ev)=>{ ev.stopPropagation(); ev.preventDefault(); };
    document.addEventListener("click", suprimirClick, {capture:true, once:true});
  }
  if (__dragState) __dragState.wrap.classList.remove("dragging");
  __dragState = null;
}
document.addEventListener("mouseup", __endDrag);
document.addEventListener("mouseleave", __endDrag);

boot();
</script>
